{% extends "navbar.html" %}
{% block content %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='create_account.css')}}">

{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for msg in messages %}<p>{{ msg }}</p>{% endfor %}
    {% endif %}
{% endwith %}

<div class="container">
    <h1>Reset Password</h1>
    <p style="color:rgba(255,255,255,0.6); font-size:1rem; margin-bottom:24px;">
        Enter your new password below.
    </p>

    <form action="#" method="POST">
        <div class="basic-info">
            <p><input type="password" name="password" placeholder="New password" required></p>
            <p><input type="password" name="confirm_password" placeholder="Confirm new password" required></p>
        </div>
        <div class="submit-btn">
            <button type="submit" class="create-account-btn">Reset Password</button>
        </div>
    </form>
</div>
{% endblock %}
