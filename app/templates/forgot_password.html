{% extends "navbar.html" %}
{% block content %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='create_account.css')}}">

{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for msg in messages %}<p>{{ msg }}</p>{% endfor %}
    {% endif %}
{% endwith %}

<div class="container">
    <h1>Forgot Password</h1>
    <p style="color:rgba(255,255,255,0.6); font-size:1rem; margin-bottom:24px;">
        Enter your email and we'll send you a reset link.
    </p>

    <form action="#" method="POST">
        <div class="basic-info">
            <p><input type="email" name="email" placeholder="Your email address" required></p>
        </div>
        <div class="submit-btn">
            <button type="submit" class="create-account-btn">Send Reset Link</button>
        </div>
        <a class="login-link" href="{{ url_for('login') }}">Back to login</a>
    </form>
</div>
{% endblock %}
